---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: slime-image
description: My personal lightweigh layer for nvidia-open bazzite atomic OS.

base-image: ghcr.io/ublue-os/bazzite-deck-nvidia-gnome
image-version: testing 

modules:
  - from-file: fonts.yml
  #- from-file: systemd.yml
  
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - atim/starship
        - lizardbyte/beta
    install:
      packages:
        - niri
        - micro
        - zed
        - brave-browser
        - starship
        - fish
        - xwayland-satellite
        - polkit-kde
        - pavucontrol
        - wf-recorder
        - mako
        - waybar
        - alacritty
        - swaybg
        - swayidle
        - swaylock
        - fuzzel
        - sunshine

  - type: default-flatpaks
    configurations:
      - notify: true 
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user 

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
