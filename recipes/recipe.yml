---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: slime-image
description: My personal lightweigh layer for nvidia-open bazzite atomic OS.

base-image: ghcr.io/ublue-os/bazzite-deck-nvidia-gnome
image-version: stable

stages:
  - name: rust-tools
    from: docker.io/library/rust:latest

    modules:
      - type: script
        snippets:
          - apt-get update && apt-get install -y git clang pkg-config libdbus-1-dev libssl-dev libpipewire-0.3-dev

          - git clone https://github.com/aashish-thapa/wlctl.git /src/wlctl
          - cd /src/wlctl && cargo build --release

          - git clone https://github.com/pythops/bluetui.git /src/bluetui
          - cd /src/bluetui && cargo build --release

          - git clone https://github.com/tsowell/wiremix.git /src/wiremix
          - cd /src/wiremix && cargo build --release

          - mkdir -p /out
          - cp /src/wlctl/target/release/wlctl /out/
          - cp /src/bluetui/target/release/bluetui /out/
          - cp /src/wiremix/target/release/wiremix /out/

modules:
  - from-file: fonts.yml
  #- from-file: systemd.yml

  - type: files
    files:
      - source: system
        destination: /

  - type: copy
    from: rust-tools
    src: /out/wlctl
    dest: /usr/bin/wlctl

  - type: copy
    from: rust-tools
    src: /out/bluetui
    dest: /usr/bin/bluetui

  - type: copy
    from: rust-tools
    src: /out/wiremix
    dest: /usr/bin/wiremix

  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - atim/starship
        - lizardbyte/beta
    install:
      packages:
        - niri
        - wlsunset
        - qemu
        - zed
        - brave-browser
        - starship
        - fish
        - xwayland-satellite
        - polkit-kde
        - pavucontrol
        - wf-recorder
        - mako
        - waybar
        - alacritty
        - swaybg
        - swayidle
        - swaylock
        - fuzzel
        - sunshine

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.World.Iotas 
          - com.discordapp.Discord
          - dev.mufeed.Wordbook 
          - de.haeckerfelix.Shortwave
          - org.kde.Sdk/x86_64/6.11
      - scope: user
  - type: script
    scripts: 
      - install-mosaic-wm.sh
      #- gamescope-sunshine-patch.sh
    snippets:
      - 'curl -fsSL https://raw.githubusercontent.com/devcontainers/cli/main/scripts/install.sh | sh'
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
